<title>Rucka Monkey Demo</title>
<meta name="description" content="Vista previa de la carta con pedidos y del panel de caja de Rucka Monkey (modo demostración)">
<style>/* Estilos compartidos: carta de clientes y panel de caja. Diseñados primero para celular. */
:root {
  --bg: #fff8ef;
  --surface: #ffffff;
  --surface-2: #fff1de;
  --ink: #23170d;
  --ink-2: #6b5646;
  --line: #ecdcc6;
  --brand: #d4471f;
  --brand-ink: #ffffff;
  --brand-2: #ffc23d;
  --ok: #1f8a4c;
  --ok-bg: #e3f5ea;
  --warn: #9a5b00;
  --warn-bg: #fff3cd;
  --bad: #b3261e;
  --bad-bg: #fde7e5;
  --info: #1d5fa3;
  --info-bg: #e3effb;
  --demo: #6d28d9;
  --demo-bg: #efe6ff;
  --radius: 16px;
  --shadow: 0 6px 24px rgba(60, 30, 5, 0.1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17110b; --surface: #221910; --surface-2: #2c2016; --ink: #fbefe1; --ink-2: #c4ad97; --line: #3d2d1f;
    --brand: #ff6a3d; --brand-2: #ffc23d; --ok: #58d08d; --ok-bg: #173424; --warn: #ffcf5c; --warn-bg: #3a2c0c;
    --bad: #ff8a80; --bad-bg: #3d1714; --info: #8cc3ff; --info-bg: #13283f; --demo: #c4a7ff; --demo-bg: #2a1d45;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17110b; --surface: #221910; --surface-2: #2c2016; --ink: #fbefe1; --ink-2: #c4ad97; --line: #3d2d1f;
  --brand: #ff6a3d; --brand-2: #ffc23d; --ok: #58d08d; --ok-bg: #173424; --warn: #ffcf5c; --warn-bg: #3a2c0c;
  --bad: #ff8a80; --bad-bg: #3d1714; --info: #8cc3ff; --info-bg: #13283f; --demo: #c4a7ff; --demo-bg: #2a1d45;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.4); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden; overflow-wrap: anywhere;
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.15; margin: 0; }
[hidden] { display: none !important; }

.demo-banner {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--demo); color: #fff; text-align: center;
  font-size: 13px; font-weight: 700; padding: 7px 12px; letter-spacing: .02em;
}
.demo-banner small { display: block; font-weight: 500; opacity: .9; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
  border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer;
  touch-action: manipulation; text-decoration: none; -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn-bad { background: var(--surface); border-color: var(--bad); color: var(--bad); }
.btn-ghost { background: transparent; }
.btn-block { width: 100%; }
.btn-sm { min-height: 40px; padding: 0 12px; border-radius: 12px; font-size: 14px; }

.tag {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; line-height: 1; padding: 5px 8px;
  border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.tag-demo { background: var(--demo-bg); color: var(--demo); }
.tag-warn { background: var(--warn-bg); color: var(--warn); }
.tag-ok { background: var(--ok-bg); color: var(--ok); }
.tag-bad { background: var(--bad-bg); color: var(--bad); }
.tag-info { background: var(--info-bg); color: var(--info); }

.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-weight: 700; font-size: 14px; }
.input, textarea.input, select.input {
  width: 100%; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  padding: 10px 12px; font-size: 16px; /* 16px evita el zoom automático en iOS */
}
textarea.input { min-height: 84px; resize: vertical; }
.input:focus-visible, .btn:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 2px; }
.check { display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 10px 0; cursor: pointer; }
.check input { width: 24px; height: 24px; flex: none; margin: 0; accent-color: var(--brand); }
.hint { font-size: 13px; color: var(--ink-2); }
.muted { color: var(--ink-2); }

/* Hoja inferior / pantalla completa en celular, diálogo centrado en escritorio */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 60; background: rgba(20, 10, 0, .5); display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 560px; max-height: 94dvh; background: var(--bg); border-radius: 22px 22px 0 0;
  display: flex; flex-direction: column; box-shadow: var(--shadow); animation: up .18s ease-out;
}
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 19px; flex: 1; }
.sheet-body { padding: 16px; overflow-y: auto; overscroll-behavior: contain; flex: 1; }
.sheet-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  display: inline-grid; place-items: center; cursor: pointer; font-size: 20px; flex: none;
}
@media (min-width: 760px) {
  .sheet-backdrop { align-items: center; }
  .sheet { border-radius: 22px; max-height: 88vh; }
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }

.toast {
  position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 90;
  background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-weight: 600; width: max-content; max-width: calc(100vw - 32px); text-align: center; pointer-events: none;
  box-shadow: var(--shadow);
}

.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); }
.stepper button { width: 46px; height: 46px; border: 0; background: none; font-size: 22px; font-weight: 700; cursor: pointer; }
.stepper output { min-width: 32px; text-align: center; font-weight: 800; }

.mods { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 4px; font-size: 14px; }
.mod-removed { color: var(--bad); font-weight: 700; }
.mod-extra { color: var(--info); font-weight: 700; }
.mod-note { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 6px 8px; font-weight: 700; }
.section-title { font-size: 15px; font-weight: 800; margin: 18px 0 4px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.box .check + .check { border-top: 1px solid var(--line); }

.pv-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; }
.pv-bar span { flex: 1; }
.pv-bar button { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.35); background: transparent; color: inherit; font-weight: 800; cursor: pointer; }
.pv-bar button.on { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.pv-fatal { max-width: 520px; margin: 40px auto; padding: 16px; }
</style>
<template id="css-cliente">/* Carta de clientes */
.top { padding: 18px 16px 10px; max-width: 1100px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 48px; height: 48px; border-radius: 14px; background: var(--brand); color: #fff; display: grid; place-items: center;
  font-weight: 900; font-size: 18px; letter-spacing: -.03em; flex: none;
}
.brand h1 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; }
.brand p { margin: 0; color: var(--ink-2); font-size: 14px; }

.cats {
  position: sticky; top: var(--banner-h, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; gap: 8px; overflow-x: auto; padding: 10px max(16px, calc((100% - 1100px) / 2 + 16px)); scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }
.cats a {
  flex: none; min-height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px;
  background: var(--surface); border: 1.5px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 700; font-size: 15px;
}
.cats a.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }

main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 130px; }
.cat { scroll-margin-top: 120px; padding-top: 14px; }
.cat h2 { font-size: 22px; font-weight: 900; margin: 6px 0 12px; }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.card {
  display: grid; grid-template-columns: 112px 1fr; gap: 12px; background: var(--surface); border-radius: var(--radius);
  padding: 10px; border: 1px solid var(--line); text-align: left; cursor: pointer; width: 100%;
}
.card:active { transform: scale(.99); }
.thumb { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--surface-2); align-self: start; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .tag { position: absolute; left: 4px; bottom: 4px; font-size: 10px; padding: 3px 6px; background: rgba(0,0,0,.6); color: #fff; }
.card h3 { font-size: 17px; font-weight: 800; }
.card .desc { font-size: 14px; color: var(--ink-2); margin: 4px 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.price { font-weight: 900; font-size: 17px; }
@media (min-width: 640px) {
  .card { grid-template-columns: 1fr; }
  .thumb { aspect-ratio: 16 / 10; }
}

.cartbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.cartbar .btn { width: 100%; max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; min-height: 56px; font-size: 17px; box-shadow: var(--shadow); }
.cartbar .count { background: rgba(255,255,255,.25); border-radius: 999px; padding: 2px 10px; }

.pd-img { position: relative; border-radius: 16px; overflow: hidden; margin-bottom: 12px; aspect-ratio: 16 / 10; }
.pd-img img { width: 100%; height: 100%; object-fit: cover; }
.pd-img .tag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; }
.foot-row { display: flex; gap: 12px; align-items: center; }
.foot-row .btn-primary { flex: 1; min-height: 52px; font-size: 16px; }

.line { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.line-head { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; }
.line-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.line-actions .stepper button { width: 42px; height: 42px; }
.total-row { display: flex; justify-content: space-between; font-size: 20px; font-weight: 900; margin: 6px 0 12px; }

.pay-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pay-opt { position: relative; }
.pay-opt input { position: absolute; opacity: 0; inset: 0; }
.pay-opt span {
  display: grid; place-items: center; min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface);
  font-weight: 800; text-align: center; padding: 6px;
}
.pay-opt input:checked + span { border-color: var(--brand); background: var(--surface-2); }
.pay-opt input:focus-visible + span { outline: 3px solid var(--brand-2); }
.bank { background: var(--surface); border: 1px dashed var(--demo); border-radius: 14px; padding: 12px; margin: 12px 0; font-size: 15px; }
.bank dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0 0; }
.bank dt { color: var(--ink-2); }
.bank dd { margin: 0; font-weight: 700; }
.notice { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 10px 0; }
.notice-warn { background: var(--warn-bg); color: var(--warn); }
.notice-info { background: var(--info-bg); color: var(--info); }
.notice-demo { background: var(--demo-bg); color: var(--demo); }
.notice-bad { background: var(--bad-bg); color: var(--bad); }
.receipt-preview { max-height: 180px; border-radius: 10px; margin-top: 8px; }

/* Estado del pedido */
.status-page { max-width: 560px; margin: 0 auto; padding: 16px 16px 60px; }
.order-code { font-size: 40px; font-weight: 900; letter-spacing: .02em; }
.steps { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 8px; }
.steps li { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.steps li .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); flex: none; }
.steps li.done { color: var(--ink); }
.steps li.done .dot { background: var(--ok); }
.steps li.now { border-color: var(--brand); color: var(--ink); font-weight: 800; }
.steps li.now .dot { background: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 25%, transparent); }
</template>
<template id="css-caja">html { scroll-padding-bottom: 90px; }
@media (min-width: 900px) { html { scroll-padding-bottom: 0; } }
/* Panel de caja: pensado primero para un cajero que solo tiene un celular. */
.brand-mark {
  width: 52px; height: 52px; border-radius: 14px; background: var(--brand); color: #fff; display: grid; place-items: center;
  font-weight: 900; font-size: 19px; margin-bottom: 12px;
}
.login { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
.login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); }
.login-card h1 { font-size: 22px; margin-bottom: 16px; }

/* Navegación: barra inferior en celular, lateral en computador */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.tabs-brand { display: none; }
.tabs button {
  position: relative; border: 0; background: none; min-height: 62px; display: grid; place-items: center; align-content: center; gap: 2px;
  font-size: 12px; font-weight: 700; color: var(--ink-2); cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.tabs button .ti { font-size: 21px; line-height: 1; }
.tabs button.on { color: var(--brand); }
.tabs button.on::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand); }
.badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 20px; height: 20px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
.panel { padding: 0 16px calc(90px + env(safe-area-inset-bottom)); max-width: 1400px; margin: 0 auto; }
.view-head { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }
.view-head h1 { font-size: 24px; font-weight: 900; flex: 1; }
.live { font-size: 12px; font-weight: 800; color: var(--ok); }
.live.off { color: var(--bad); }

@media (min-width: 900px) {
  .tabs { top: 0; right: auto; width: 200px; grid-template-columns: 1fr; align-content: start; border-top: 0; border-right: 1px solid var(--line); padding: 12px; gap: 4px; }
  .tabs-brand { display: block; font-weight: 900; font-size: 18px; padding: 8px 10px 16px; }
  .tabs button { grid-auto-flow: column; justify-content: start; gap: 10px; font-size: 15px; min-height: 48px; border-radius: 12px; padding: 0 12px; }

}

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 700; font-size: 14px; cursor: pointer;
}
.chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips button b { margin-left: 4px; }

.orders { display: grid; gap: 12px; grid-template-columns: 1fr; }

@media (min-width: 1250px) { .orders { grid-template-columns: repeat(3, 1fr); } }

.list-row .r1 { display: flex; gap: 8px; }
.list-row .r1 .input { flex: 1; }

<script>'use strict';
// Utilidades compartidas por la carta y el panel.
const RM = (() => {
  const fmt = new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 });
  const money = (n) => fmt.format(n || 0);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const timeFmt = new Intl.DateTimeFormat('es-CL', { timeZone: 'America/Santiago', hour: '2-digit', minute: '2-digit' });
  const dateTimeFmt = new Intl.DateTimeFormat('es-CL', { timeZone: 'America/Santiago', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

  async function api(url, opts = {}) {
    const o = { credentials: 'same-origin', ...opts, headers: { 'X-Requested-With': 'rucka', ...(opts.headers || {}) } };
    if (o.json !== undefined) {
      o.body = JSON.stringify(o.json);
      o.headers['Content-Type'] = 'application/json';
      delete o.json;
    }
    const res = await fetch(url, o);
    let data = null;
    try { data = await res.json(); } catch { /* sin cuerpo */ }
    if (!res.ok) {
      const err = new Error(data?.error || `Error ${res.status}`);
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  let toastTimer;
  function toast(msg, ms = 2600) {
    let el = document.querySelector('.toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast';
      el.setAttribute('role', 'status');
      document.body.append(el);
    }
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, ms);
  }

  // Hoja inferior accesible. Devuelve { root, body, foot, close }.
  function sheet({ title, body = '', foot = '', onClose, wide = false }) {
    const back = document.createElement('div');
    back.className = 'sheet-backdrop';
    back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" ${wide ? 'style="max-width:760px"' : ''}>
      <div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
      <div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}</div>`;
    const prevFocus = document.activeElement;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    document.body.append(back);
    const close = () => {
      back.remove();
      document.body.style.overflow = document.querySelector('.sheet-backdrop') ? 'hidden' : prevOverflow;
      document.removeEventListener('keydown', onKey);
      prevFocus?.focus?.();
      onClose?.();
    };
    const onKey = (e) => { if (e.key === 'Escape' && back === [...document.querySelectorAll('.sheet-backdrop')].pop()) close(); };
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', (e) => { if (e.target === back || e.target.closest('[data-close]')) close(); });
    back.querySelector('[data-close]').focus();
    return { root: back, body: back.querySelector('.sheet-body'), foot: back.querySelector('.sheet-foot'), close };
  }

  // Confirmación con botones grandes (reemplaza a window.confirm, que algunos navegadores bloquean en páginas incrustadas).
  function confirmDialog(message, { ok = 'Confirmar', danger = false } = {}) {
    return new Promise((resolve) => {
      let answered = false;
      const sh = sheet({
        title: 'Confirmar',
        body: `<p style="margin:0">${esc(message)}</p>`,
        foot: `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" data-no>Cancelar</button><button class="btn ${danger ? 'btn-bad' : 'btn-primary'}" data-yes>${esc(ok)}</button></div>`,
        onClose: () => { if (!answered) resolve(false); },
      });
      sh.root.querySelector('[data-yes]').addEventListener('click', () => { answered = true; sh.close(); resolve(true); });
      sh.root.querySelector('[data-no]').addEventListener('click', () => sh.close());
    });
  }

  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* almacenamiento no disponible */ } },
    del(k) { try { localStorage.removeItem(k); } catch { /* */ } },
  };

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, '0')).join(''));

  const STATUS = {
    pendiente: 'Pendiente',
    pago_confirmado: 'Pago confirmado',
    en_preparacion: 'En preparación',
    listo: 'Listo para retirar',
    entregado: 'Entregado',
    rechazado: 'Rechazado',
  };

  function modsHtml(item) {
    const out = [];
    for (const r of item.removed || []) out.push(`<li class="mod-removed">SIN ${esc(r)}</li>`);
    for (const e of item.extras || []) out.push(`<li class="mod-extra">+ ${esc(e.name)} (${money(e.price)})</li>`);
    if (item.note) out.push(`<li class="mod-note">Nota: “${esc(item.note)}”</li>`);
    return out.length ? `<ul class="mods">${out.join('')}</ul>` : '';
  }

  return { money, esc, api, toast, sheet, confirm: confirmDialog, store, uuid, STATUS, modsHtml, timeFmt, dateTimeFmt };
})();
</script>
<script>'use strict';
// VISTA PREVIA en claude.ai: reemplaza el servidor Node por la base de datos compartida del Artifact.
// Implementa las mismas rutas /api/... que usa la carta y el panel, para reutilizar su código tal cual.
// IMPORTANTE: aquí la lógica corre en el navegador. Sirve para probar la experiencia; la protección
// real (contraseña, comprobantes privados, recálculo en servidor) está en la versión Node (carpeta server/).
const RMPreview = (() => {
  let db = null;
  let assets = null;
  let user = null;
  let catalog = null;   // { nextId, categories, products }
  let settings = null;  // { key: value }
  const orders = new Map();
  let ready;
  const listeners = new Set();

  const ILLUS = window.RM_ILLUSTRATIONS || {};
  const TZ = 'America/Santiago';

  class ApiError extends Error {
    constructor(status, message, data = {}) { super(message); this.status = status; this.data = { error: message, ...data }; }
  }
  const E = (status, code, message, extra = {}) => new ApiError(status, message, { code, ...extra });

  // ---------------- Zona horaria de Chile (misma lógica que server/time.js) ----------------
  const partsFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  function parts(ms) { const o = {}; for (const p of partsFmt.formatToParts(new Date(ms))) if (p.type !== 'literal') o[p.type] = Number(p.value); return o; }
  function offsetAt(ms) { const p = parts(ms); return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(ms / 1000) * 1000; }
  function localMidnight(y, m, d) { const g = Date.UTC(y, m - 1, d); let t = g - offsetAt(g); t = g - offsetAt(t); return t; }
  function chileDayRange(ms = Date.now()) {
    const p = parts(ms);
    const start = localMidnight(p.year, p.month, p.day);
    const n = new Date(Date.UTC(p.year, p.month - 1, p.day + 1));
    return { start, end: localMidnight(n.getUTCFullYear(), n.getUTCMonth() + 1, n.getUTCDate()), label: `${String(p.day).padStart(2, '0')}-${String(p.month).padStart(2, '0')}-${p.year}` };
  }

  // ---------------- Conexión con la base compartida ----------------
  async function init() {
    if (ready) return ready;
    ready = (async () => {
      const c = window.claude;
      if (!c?.use) throw new Error('Esta vista previa debe abrirse desde claude.ai');
      [db, assets, user] = await Promise.all([c.use('db'), c.use('assets'), c.use('user')]);
      if (!db) throw new Error('La base de datos compartida no está disponible en esta vista');
      await new Promise((resolve, reject) => {
        let pending = 3;
        const done = () => { if (--pending === 0) resolve(); };
        let a = false; let b = false; let o = false;
        db.doc('menu/catalog').onSnapshot((s) => { catalog = s.exists ? structuredClone(s.data()) : null; if (!a) { a = true; done(); } notify(); }, reject);
        db.doc('menu/settings').onSnapshot((s) => { settings = s.exists ? { ...s.data() } : {}; if (!b) { b = true; done(); } notify(); }, reject);
        db.collection('orders').onSnapshot((snap) => {
          orders.clear();
          for (const d of snap.docs) orders.set(d.id, d.data());
          if (!o) { o = true; done(); }
          notify();
        }, reject);
      });
    })();
    return ready;
  }
  const notify = () => listeners.forEach((fn) => { try { fn(); } catch { /* */ } });
  const onChange = (fn) => listeners.add(fn);

  async function canCashier() {
    if (!user) return true; // sin información del visor: se permite (solo vista previa)
    return (await user.isOwner()) || (await user.canEdit());
  }

  // ---------------- Ayudas de catálogo ----------------
  const needCatalog = () => { if (!catalog) throw E(503, 'NO_DATA', 'La carta aún no tiene datos cargados'); return catalog; };
  const isDemo = () => (settings?.demo_mode ?? '1') === '1';
  const clean = (s, max) => String(s ?? '').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);
  const intIds = (arr) => [...new Set((Array.isArray(arr) ? arr : []).map(Number).filter((n) => Number.isInteger(n) && n > 0))].sort((a, b) => a - b);
  const sortBy = (a, b) => (a.sort - b.sort) || (a.id - b.id);

  function productImage(p) {
    if (p.photo) return { image: `/_blob/${p.photo}`, imageKind: 'foto' };
    if (p.illustration && ILLUS[p.illustration]) return { image: ILLUS[p.illustration], imageKind: 'ilustracion' };
    return { image: null, imageKind: null };
  }
  function catalogView(includeInactive) {
    const cat = needCatalog();
    return cat.categories.filter((c) => includeInactive || c.active).sort(sortBy).map((c) => ({
      id: c.id, name: c.name, active: c.active, sort: c.sort,
      products: cat.products.filter((p) => p.categoryId === c.id && (includeInactive || p.active)).sort(sortBy).map((p) => ({
        ...p, hasPhoto: !!p.photo, ...productImage(p),
        extras: p.extras.filter((e) => includeInactive || e.active),
      })),
    }));
  }
  async function saveCatalog(mutate) {
    const next = structuredClone(needCatalog());
    const out = mutate(next);
    await db.doc('menu/catalog').set(next);
    catalog = next;
    return out;
  }
  const findProduct = (cat, id) => { const p = cat.products.find((x) => x.id === Number(id)); if (!p) throw E(404, 'NOT_FOUND', 'Producto no encontrado'); return p; };
  const str = (v, max, field) => { const s = String(v ?? '').trim().slice(0, max); if (!s) throw E(400, 'BAD_REQUEST', `Falta ${field}`); return s; };
  const price = (v) => { const n = Number(v); if (!Number.isInteger(n) || n < 0 || n > 1_000_000) throw E(400, 'BAD_REQUEST', 'Precio inválido (entero en pesos, sin puntos)'); return n; };

  // ---------------- Pedidos (misma lógica que server/orders.js) ----------------
  function normalize(raw) {
    if (!raw || typeof raw !== 'object') throw E(400, 'BAD_REQUEST', 'Pedido inválido');
    const key = String(raw.idempotencyKey || '');
    if (!/^[A-Za-z0-9-]{16,64}$/.test(key)) throw E(400, 'BAD_REQUEST', 'Falta el identificador del pedido');
    const customerName = clean(raw.customerName, 40);
    if (customerName.length < 2) throw E(400, 'NAME_REQUIRED', 'Escribe tu nombre para el pedido');
    if (!['efectivo', 'transferencia'].includes(raw.paymentMethod)) throw E(400, 'BAD_PAYMENT', 'Elige efectivo o transferencia');
    if (!Array.isArray(raw.items) || !raw.items.length) throw E(400, 'EMPTY', 'El carrito está vacío');
    if (raw.items.length > 40) throw E(400, 'TOO_MANY', 'Demasiadas líneas en el pedido');
    const items = raw.items.map((it) => {
      const quantity = Number(it?.quantity);
      if (!Number.isInteger(quantity) || quantity < 1 || quantity > 20) throw E(400, 'BAD_QTY', 'Cantidad inválida (máximo 20 por línea)');
      return { productId: Number(it.productId), quantity, removedIngredientIds: intIds(it.removedIngredientIds), extraIds: intIds(it.extraIds), note: clean(it.note, 140) };
    });
    return { key, customerName, paymentMethod: raw.paymentMethod, items, expectedTotal: raw.expectedTotal == null ? null : Number(raw.expectedTotal) };
  }
  function priceItems(items) {
    const cat = needCatalog();
    return items.map((it) => {
      const p = cat.products.find((x) => x.id === it.productId);
      const c = p && cat.categories.find((x) => x.id === p.categoryId);
      if (!p || !p.active || !c?.active) throw E(409, 'UNAVAILABLE', 'Un producto del carrito ya no está disponible');
      const removed = it.removedIngredientIds.map((id) => {
        const g = p.ingredients.find((x) => x.id === id);
        if (!g || !g.removable) throw E(409, 'MENU_CHANGED', `Los ingredientes de "${p.name}" cambiaron. Revisa el carrito.`);
        return g.name;
      });
      const extras = it.extraIds.map((id) => {
        const e = p.extras.find((x) => x.id === id);
        if (!e || !e.active) throw E(409, 'MENU_CHANGED', `Los extras de "${p.name}" cambiaron. Revisa el carrito.`);
        return { name: e.name, price: e.price };
      });
      const unit = p.price + extras.reduce((s, e) => s + e.price, 0);
      return { productName: p.name, unitPrice: unit, quantity: it.quantity, removed, extras, note: it.note, lineTotal: unit * it.quantity };
    });
  }
  const payloadHash = (o) => JSON.stringify([o.customerName, o.paymentMethod, o.items]);

  async function createOrder(fd) {
    let raw;
    try { raw = JSON.parse(fd.get('order') || 'null'); } catch { throw E(400, 'BAD_REQUEST', 'Pedido inválido'); }
    const o = normalize(raw);
    const hash = payloadHash(o);
    const ref = db.doc(`orders/${o.key}`);
    const existing = orders.get(o.key) || (await ref.get()).data?.();
    if (existing) {
      if (existing.payloadHash !== hash) throw E(409, 'KEY_REUSED', 'Este pedido ya fue enviado con otro contenido');
      return { status: 200, body: { code: existing.code, token: existing.token, total: existing.total, duplicate: true } };
    }
    const items = priceItems(o.items);
    const total = items.reduce((s, l) => s + l.lineTotal, 0);
    if (o.expectedTotal != null && o.expectedTotal !== total) throw E(409, 'PRICE_CHANGED', 'Los precios cambiaron desde que abriste la carta. Revisa el carrito antes de enviar.', { total });

    let receiptId = null;
    const file = fd.get('receipt');
    if (file && file.size) {
      if (o.paymentMethod !== 'transferencia') throw E(400, 'BAD_REQUEST', 'El comprobante solo aplica a transferencias');
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) throw E(400, 'BAD_IMAGE', 'La imagen debe ser JPG, PNG o WEBP');
      if (file.size > 8 * 1024 * 1024) throw E(400, 'BAD_IMAGE', 'La imagen supera los 8 MB');
      if (!assets) throw E(403, 'NO_ASSETS', 'En esta vista no se pueden adjuntar imágenes. Envía el pedido sin comprobante.');
      try { receiptId = (await assets.upload(file, { type: file.type })).id; } catch (e) { throw E(400, 'UPLOAD', `No se pudo subir el comprobante (${e?.code || 'error'})`); }
    }
    const demo = isDemo();
    const used = new Set([...orders.values()].map((x) => x.code));
    let n = orders.size + 1;
    const prefix = demo ? 'DEMO-' : 'RM-';
    while (used.has(prefix + String(n).padStart(4, '0'))) n++;
    const now = Date.now();
    const doc = {
      id: o.key, token: o.key, code: prefix + String(n).padStart(4, '0'), payloadHash: hash,
      customerName: o.customerName, paymentMethod: o.paymentMethod, status: 'pendiente', total, items,
      hasNotes: items.some((l) => l.note || l.removed.length), notesReviewed: false, isDemo: demo,
      receiptId, staffNote: '', createdAt: now, paidAt: null, updatedAt: now,
      events: [{ status: 'pendiente', detail: 'Pedido recibido', at: now }],
    };
    await ref.set(doc);
    orders.set(o.key, doc);
    return { status: 201, body: { code: doc.code, token: doc.token, total, duplicate: false } };
  }

  const TRANSITIONS = {
    pendiente: ['pago_confirmado', 'rechazado'], pago_confirmado: ['en_preparacion', 'rechazado'],
    en_preparacion: ['listo', 'rechazado'], listo: ['entregado'], entregado: [], rechazado: ['pendiente'],
  };
  async function changeStatus(id, body) {
    const o = orders.get(id);
    if (!o) throw E(404, 'NOT_FOUND', 'Pedido no encontrado');
    const next = body?.status;
    if (!(TRANSITIONS[o.status] || []).includes(next)) throw E(409, 'BAD_TRANSITION', `No se puede pasar de "${o.status}" a "${next}"`);
    const now = Date.now();
    const u = { ...o, status: next, updatedAt: now, events: [...(o.events || [])] };
    let detail = '';
    if (next === 'pago_confirmado') {
      if (o.hasNotes && !o.notesReviewed && body.notesReviewed !== true) throw E(409, 'NOTES_NOT_REVIEWED', 'Revisa las indicaciones del pedido antes de confirmarlo');
      if (o.paymentMethod === 'transferencia' && body.bankVerified !== true) throw E(409, 'BANK_NOT_VERIFIED', 'Confirma que verificaste el abono en la cuenta bancaria. El comprobante por sí solo no confirma el pago.');
      if (o.paymentMethod === 'efectivo' && body.cashReceived !== true) throw E(409, 'CASH_NOT_RECEIVED', 'Confirma que recibiste el efectivo');
      u.notesReviewed = true;
      u.paidAt = now;
      detail = o.paymentMethod === 'transferencia' ? 'Abono verificado en la cuenta bancaria' : 'Efectivo recibido';
    }
    if (next === 'rechazado') detail = clean(body.reason, 200) || 'Rechazado por caja';
    if (next === 'pendiente') { detail = 'Reabierto por caja'; u.paidAt = null; }
    u.events.push({ status: next, detail, at: now });
    await db.doc(`orders/${id}`).set(u);
    orders.set(id, u);
    return u;
  }
  const adminOrder = (o) => ({ ...o, receipt: o.receiptId ? `/_blob/${o.receiptId}` : null });

  function readiness() {
    const cat = needCatalog();
    const act = cat.products.filter((p) => p.active);
    const names = (arr) => arr.map((p) => p.name).sort();
    const blockers = [];
    const add = (msg, items = []) => { if (items === true || items.length) blockers.push({ msg, items: items === true ? [] : items }); };
    add('Productos activos con precio de prueba', names(act.filter((p) => p.priceIsTest)));
    add('Productos provisionales activos (p. ej. bebidas de ejemplo)', names(act.filter((p) => p.isPlaceholder)));
    add('Descripciones provisionales sin revisar', names(act.filter((p) => p.descriptionProvisional)));
    add('Productos con ingredientes provisionales', names(act.filter((p) => p.ingredients.some((g) => g.provisional))));
    if (settings.bank_is_test !== '0') add('Los datos bancarios siguen marcados como de prueba', true);
    if (!settings.public_url) add('Falta la dirección pública definitiva (https://...)', true);
    const illus = names(act.filter((p) => !p.photo));
    return { ready: !blockers.length, blockers, warnings: illus.length ? [{ msg: 'Productos que siguen con imagen ilustrativa (se muestran rotuladas como ilustración)', items: illus }] : [] };
  }

  function qrSvg(url) {
    const q = window.qrcode(0, 'M');
    q.addData(url);
    q.make();
    return q.createSvgTag(8, 16);
  }

  // ---------------- Enrutador ----------------
  const routes = [];
  const route = (method, pattern, fn, admin = false) => routes.push({ method, re: new RegExp(`^${pattern.replace(/:(\w+)/g, '(?<$1>[^/]+)')}$`), fn, admin });

  route('GET', '/api/menu', () => ({
    settings: {
      businessName: settings.business_name || 'Rucka Monkey', demoMode: isDemo(), bankIsTest: settings.bank_is_test !== '0',
      bank: { holder: settings.bank_holder || '', rut: settings.bank_rut || '', name: settings.bank_name || '', account_type: settings.bank_account_type || '', account_number: settings.bank_account_number || '', email: settings.bank_email || '' },
    },
    categories: catalogView(false).filter((c) => c.products.length),
  }));
  route('POST', '/api/orders', (_p, o) => createOrder(o.body));
  route('GET', '/api/orders/:token', ({ token }) => {
    const o = orders.get(token);
    if (!o) throw E(404, 'NOT_FOUND', 'Pedido no encontrado');
    return { code: o.code, status: o.status, customerName: o.customerName, paymentMethod: o.paymentMethod, total: o.total, isDemo: o.isDemo, receiptAttached: !!o.receiptId, createdAt: o.createdAt, items: o.items };
  });

  route('GET', '/api/admin/session', async () => ({ loggedIn: await canCashier() }));
  route('POST', '/api/admin/login', async () => { if (await canCashier()) return { ok: true }; throw E(401, 'NO', 'En la vista previa, la caja solo se abre para el dueño o los editores de esta página.'); });
  route('POST', '/api/admin/logout', () => ({ ok: true }));
  route('POST', '/api/admin/password', () => { throw E(400, 'PREVIEW', 'En la vista previa el acceso lo controla claude.ai. La contraseña existe en la versión instalada.'); }, true);

  route('GET', '/api/admin/orders', () => {
    const { start, end } = chileDayRange();
    const ACTIVE = ['pendiente', 'pago_confirmado', 'en_preparacion', 'listo'];
    const list = [...orders.values()].filter((o) => (o.createdAt >= start && o.createdAt < end) || ACTIVE.includes(o.status)).sort((a, b) => b.createdAt - a.createdAt);
    return { orders: list.map(adminOrder), serverTime: Date.now() };
  }, true);
  route('POST', '/api/admin/orders/:id/status', async ({ id }, o) => ({ order: adminOrder(await changeStatus(decodeURIComponent(id), o.json)) }), true);
  route('POST', '/api/admin/orders/:id/staff-note', async ({ id }, o) => {
    const cur = orders.get(decodeURIComponent(id));
    if (!cur) throw E(404, 'NOT_FOUND', 'Pedido no encontrado');
    const u = { ...cur, staffNote: String(o.json?.note ?? '').slice(0, 300), updatedAt: Date.now() };
    await db.doc(`orders/${cur.id}`).set(u);
    orders.set(cur.id, u);
    return { ok: true };
  }, true);
  route('DELETE', '/api/admin/demo-orders', async () => {
    const demo = [...orders.values()].filter((o) => o.isDemo);
    for (const o of demo) {
      await db.doc(`orders/${o.id}`).delete();
      if (o.receiptId && assets) await assets.delete(o.receiptId).catch(() => {});
      orders.delete(o.id);
    }
    return { deleted: demo.length };
  }, true);
  route('GET', '/api/admin/stats', () => {
    const { start, end, label } = chileDayRange();
    const PAID = ['pago_confirmado', 'en_preparacion', 'listo', 'entregado'];
    const calc = (demo) => {
      const all = [...orders.values()].filter((o) => o.isDemo === demo);
      const today = all.filter((o) => o.createdAt >= start && o.createdAt < end);
      const paid = today.filter((o) => PAID.includes(o.status));
      const ventas = paid.reduce((s, o) => s + o.total, 0);
      return { pedidosDelDia: today.length, rechazados: today.filter((o) => o.status === 'rechazado').length, pendientes: all.filter((o) => o.status === 'pendiente').length, ventasConfirmadas: ventas, pedidosPagados: paid.length, ticketPromedio: paid.length ? Math.round(ventas / paid.length) : 0 };
    };
    return { dia: label, zonaHoraria: TZ, real: calc(false), demo: calc(true) };
  }, true);

  route('GET', '/api/admin/catalog', () => ({ categories: catalogView(true) }), true);
  route('POST', '/api/admin/categories', (_p, o) => saveCatalog((c) => {
    const id = c.nextId++;
    c.categories.push({ id, name: str(o.json?.name, 40, 'el nombre'), sort: Math.max(0, ...c.categories.map((x) => x.sort)) + 1, active: true });
    return { id };
  }), true);
  route('PATCH', '/api/admin/categories/:id', ({ id }, o) => saveCatalog((c) => {
    const cat = c.categories.find((x) => x.id === Number(id));
    if (!cat) throw E(404, 'NOT_FOUND', 'Categoría no encontrada');
    if (o.json?.name !== undefined) cat.name = str(o.json.name, 40, 'el nombre');
    if (o.json?.active !== undefined) cat.active = !!o.json.active;
    return { ok: true };
  }), true);
  route('POST', '/api/admin/categories/reorder', (_p, o) => saveCatalog((c) => { (o.json?.ids || []).forEach((id, i) => { const x = c.categories.find((k) => k.id === Number(id)); if (x) x.sort = i + 1; }); return { ok: true }; }), true);

  function writeProduct(c, id, b) {
    const cur = id ? findProduct(c, id) : null;
    const v = cur || { id: c.nextId++, ingredients: [], extras: [], photo: null, description: '', descriptionProvisional: true, priceIsTest: true, isPlaceholder: false, active: true, illustration: null };
    if (b.categoryId !== undefined) { if (!c.categories.some((x) => x.id === Number(b.categoryId))) throw E(400, 'BAD_REQUEST', 'Categoría inválida'); v.categoryId = Number(b.categoryId); }
    if (b.name !== undefined) v.name = str(b.name, 60, 'el nombre');
    if (b.description !== undefined) v.description = String(b.description ?? '').trim().slice(0, 300);
    if (b.price !== undefined) v.price = price(b.price);
    for (const k of ['descriptionProvisional', 'priceIsTest', 'isPlaceholder', 'active']) if (b[k] !== undefined) v[k] = !!b[k];
    if (b.illustration !== undefined) v.illustration = b.illustration || null;
    if (v.categoryId == null || !v.name || v.price == null) throw E(400, 'BAD_REQUEST', 'Faltan categoría, nombre o precio');
    if (!cur) { v.sort = Math.max(0, ...c.products.filter((p) => p.categoryId === v.categoryId).map((p) => p.sort)) + 1; c.products.push(v); }
    return { id: v.id };
  }
  route('POST', '/api/admin/products', (_p, o) => saveCatalog((c) => writeProduct(c, null, o.json || {})), true);
  route('PATCH', '/api/admin/products/:id', ({ id }, o) => saveCatalog((c) => writeProduct(c, id, o.json || {})), true);
  route('DELETE', '/api/admin/products/:id', async ({ id }) => {
    const photo = findProduct(needCatalog(), id).photo;
    await saveCatalog((c) => { c.products = c.products.filter((p) => p.id !== Number(id)); });
    if (photo && assets) await assets.delete(photo).catch(() => {});
    return { ok: true };
  }, true);
  route('POST', '/api/admin/products/reorder', (_p, o) => saveCatalog((c) => { (o.json?.ids || []).forEach((id, i) => { const x = c.products.find((k) => k.id === Number(id)); if (x) x.sort = i + 1; }); return { ok: true }; }), true);
  function replaceList(c, id, list, map) {
    const p = findProduct(c, id);
    if (!Array.isArray(list) || list.length > 40) throw E(400, 'BAD_REQUEST', 'Lista inválida');
    return { p, rows: list.map((r) => ({ ...map(r), id: Number(r.id) || c.nextId++ })) };
  }
  route('PUT', '/api/admin/products/:id/ingredients', ({ id }, o) => saveCatalog((c) => {
    const { p, rows } = replaceList(c, id, o.json?.ingredients, (g) => ({ name: str(g.name, 40, 'el nombre del ingrediente'), removable: !!g.removable, provisional: !!g.provisional }));
    p.ingredients = rows;
    return { ok: true };
  }), true);
  route('PUT', '/api/admin/products/:id/extras', ({ id }, o) => saveCatalog((c) => {
    const { p, rows } = replaceList(c, id, o.json?.extras, (e) => ({ name: str(e.name, 40, 'el nombre del extra'), price: price(e.price), active: e.active !== false }));
    p.extras = rows;
    return { ok: true };
  }), true);
  route('POST', '/api/admin/products/:id/photo', async ({ id }, o) => {
    const file = o.body.get('photo');
    if (!file || !['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) throw E(400, 'BAD_IMAGE', 'La imagen debe ser JPG, PNG o WEBP');
    if (!assets) throw E(403, 'NO_ASSETS', 'Esta vista no puede subir imágenes');
    const old = findProduct(needCatalog(), id).photo;
    const up = await assets.upload(file, { type: file.type });
    await saveCatalog((c) => { findProduct(c, id).photo = up.id; });
    if (old) await assets.delete(old).catch(() => {});
    return { image: `/_blob/${up.id}` };
  }, true);
  route('DELETE', '/api/admin/products/:id/photo', async ({ id }) => {
    const old = findProduct(needCatalog(), id).photo;
    await saveCatalog((c) => { findProduct(c, id).photo = null; });
    if (old && assets) await assets.delete(old).catch(() => {});
    return { ok: true };
  }, true);
  route('GET', '/api/admin/illustrations', () => ({ files: Object.keys(ILLUS).sort() }), true);

  const EDITABLE = ['business_name', 'bank_holder', 'bank_rut', 'bank_name', 'bank_account_type', 'bank_account_number', 'bank_email', 'public_url', 'bank_is_test'];
  route('GET', '/api/admin/settings', () => Object.fromEntries(EDITABLE.concat('demo_mode', 'test_url').map((k) => [k, settings[k] ?? (k === 'demo_mode' ? '1' : '')])), true);
  route('PATCH', '/api/admin/settings', async (_p, o) => {
    const next = { ...settings };
    for (const k of EDITABLE) {
      const b = o.json || {};
      if (b[k] === undefined) continue;
      let v = String(b[k]).trim().slice(0, 120);
      if (k === 'bank_is_test') v = b[k] === true || b[k] === '1' ? '1' : '0';
      if (k === 'public_url' && v) {
        let u; try { u = new URL(v); } catch { throw E(400, 'BAD_REQUEST', 'La dirección pública no es una URL válida'); }
        if (u.protocol !== 'https:') throw E(400, 'BAD_REQUEST', 'La dirección pública debe comenzar con https://');
        v = u.origin + u.pathname.replace(/\/+$/, '');
      }
      next[k] = v;
    }
    await db.doc('menu/settings').set(next);
    settings = next;
    return { ok: true };
  }, true);
  route('GET', '/api/admin/readiness', () => readiness(), true);
  route('POST', '/api/admin/demo-mode', async (_p, o) => {
    const enable = o.json?.enabled === true;
    if (!enable) { const r = readiness(); if (!r.ready) throw E(409, 'NOT_READY', 'Aún hay datos provisionales. Revisa la lista antes de salir del modo demostración.', r); }
    const next = { ...settings, demo_mode: enable ? '1' : '0' };
    await db.doc('menu/settings').set(next);
    settings = next;
    return { demoMode: enable };
  }, true);
  route('GET', '/api/admin/qr', ({ }, o) => {
    const q = new URLSearchParams(o.query);
    if (q.get('type') === 'final') {
      if (isDemo()) throw E(409, 'DEMO', 'El QR definitivo solo se genera cuando se sale del modo demostración');
      if (!settings.public_url) throw E(409, 'NO_URL', 'Falta la dirección pública definitiva');
      const url = settings.public_url + '/';
      return { type: 'final', url, svg: qrSvg(url) };
    }
    const base = q.get('base') || settings.test_url;
    let u; try { u = new URL(base); } catch { throw E(400, 'BAD_REQUEST', 'Escribe la dirección de esta vista previa (el enlace de claude.ai)'); }
    return { type: 'prueba', url: u.href, svg: qrSvg(u.href) };
  }, true);

  async function api(url, opts = {}) {
    await init();
    const [path, query = ''] = url.split('?');
    const method = (opts.method || 'GET').toUpperCase();
    const json = opts.json !== undefined ? structuredClone(opts.json) : undefined;
    for (const r of routes) {
      const m = r.method === method && path.match(r.re);
      if (!m) continue;
      if (r.admin && !(await canCashier())) throw new ApiError(401, 'No autorizado');
      try {
        const out = await r.fn(m.groups || {}, { json, body: opts.body, query });
        return out && out.status && out.body ? out.body : out;
      } catch (e) {
        if (e instanceof ApiError) throw e;
        if (e?.code === 'invalid_argument') throw new ApiError(403, 'No tienes permiso para guardar en esta vista previa');
        console.error(e);
        throw new ApiError(500, e?.message || 'Error interno');
      }
    }
    throw new ApiError(404, 'No encontrado');
  }

  return { init, api, onChange, canCashier };
})();
</script>

'use strict';
(() => {

  const CART_KEY = 'rm_cart_v1';
  const CHECKOUT_KEY = 'rm_checkout_key';
  const LAST_KEY = 'rm_last_order';

  let menu = null;          // respuesta de /api/menu
  let products = new Map(); // id -> producto
  let cart = store.get(CART_KEY, []);

  const $ = (s) => document.querySelector(s);

  // ---------------- Carga ----------------
  async function loadMenu() {
    menu = await api('/api/menu');
    products = new Map(menu.categories.flatMap((c) => c.products).map((p) => [p.id, p]));
    const s = menu.settings;
    $('#bizName').textContent = s.businessName || 'Rucka Monkey';
    $('#demoBanner').hidden = !s.demoMode;
    document.documentElement.style.setProperty('--banner-h', s.demoMode ? `${$('#demoBanner').offsetHeight}px` : '0px');
    // Quita del carrito lo que ya no existe (producto desactivado, ingrediente o extra eliminado)
    cart = cart.filter((l) => products.has(l.productId)).map((l) => {
      const p = products.get(l.productId);
      const ing = new Set(p.ingredients.filter((g) => g.removable).map((g) => g.id));
      const ex = new Set(p.extras.map((e) => e.id));
      return { ...l, removed: l.removed.filter((id) => ing.has(id)), extras: l.extras.filter((id) => ex.has(id)) };
    });
    saveCart();
  }

  function productImg(p, cls = 'thumb') {
    if (!p.image) return `<div class="${cls}"></div>`;
    const label = p.imageKind === 'ilustracion' ? '<span class="tag">Ilustración</span>' : '';
    return `<div class="${cls}"><img src="${esc(p.image)}" alt="${p.imageKind === 'ilustracion' ? 'Ilustración de ' : 'Foto de '}${esc(p.name)}" loading="lazy">${label}</div>`;
  }

  function renderMenu() {
    const cats = menu.categories;
    $('#cats').innerHTML = cats.map((c, i) => `<a href="#cat-${c.id}" class="${i === 0 ? 'on' : ''}" data-cat="${c.id}">${esc(c.name)}</a>`).join('');
    $('#menu').innerHTML = cats.map((c) => `
      <section class="cat" id="cat-${c.id}" aria-labelledby="h-${c.id}">
        <h2 id="h-${c.id}">${esc(c.name)}</h2>
        ${c.products.some((p) => p.isPlaceholder) ? '<p class="notice notice-demo">Opciones provisionales: el listado real de bebidas aún no está cargado.</p>' : ''}
        <div class="grid">
          ${c.products.map((p) => `
            <button class="card" data-product="${p.id}" aria-label="${esc(p.name)}, ${money(p.price)}">
              ${productImg(p)}
              <div>
                <h3>${esc(p.name)}</h3>
                <p class="desc">${esc(p.description)}</p>
                <div class="row">
                  <span class="price">${money(p.price)}</span>
                  ${p.priceIsTest ? '<span class="tag tag-demo">Precio de prueba</span>' : ''}
                  ${p.descriptionProvisional ? '<span class="tag tag-warn">Descripción provisional</span>' : ''}
                  ${p.isPlaceholder ? '<span class="tag tag-warn">Provisional</span>' : ''}
                </div>
              </div>
            </button>`).join('')}
        </div>
      </section>`).join('');
    observeCats();
  }

  function observeCats() {
    if (!('IntersectionObserver' in window)) return;
    const links = [...document.querySelectorAll('#cats a')];
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        const id = e.target.id.replace('cat-', '');
        links.forEach((a) => a.classList.toggle('on', a.dataset.cat === id));
        const on = links.find((a) => a.dataset.cat === id);
        on?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      }
    }, { rootMargin: '-40% 0px -55% 0px' });
    document.querySelectorAll('.cat').forEach((s) => io.observe(s));
  }

  // ---------------- Carrito ----------------
  function saveCart() {
    store.set(CART_KEY, cart);
    renderCartBar();
  }
  function unitPrice(l) {
    const p = products.get(l.productId);
    return p.price + p.extras.filter((e) => l.extras.includes(e.id)).reduce((s, e) => s + e.price, 0);
  }
  const cartTotal = () => cart.reduce((s, l) => s + unitPrice(l) * l.quantity, 0);
  const cartCount = () => cart.reduce((s, l) => s + l.quantity, 0);
  const sameConfig = (a, b) => a.productId === b.productId && a.note === b.note &&
    a.removed.join() === b.removed.join() && a.extras.join() === b.extras.join();

  function renderCartBar() {
    const n = cartCount();
    $('#cartbar').hidden = n === 0;
    $('#cartCount').textContent = n;
    if (products.size) $('#cartTotal').textContent = money(cartTotal());
  }

  function lineView(l) {
    const p = products.get(l.productId);
    return {
      removed: p.ingredients.filter((g) => l.removed.includes(g.id)).map((g) => g.name),
      extras: p.extras.filter((e) => l.extras.includes(e.id)),
      note: l.note,
    };
  }

  // ---------------- Personalización de un producto ----------------
  // `editing` = línea existente del carrito que se está modificando.
  function openProduct(pid, editing = null) {
    const p = products.get(pid);
    if (!p) return;
    const st = editing
      ? { quantity: editing.quantity, removed: new Set(editing.removed), extras: new Set(editing.extras), note: editing.note }
      : { quantity: 1, removed: new Set(), extras: new Set(), note: '' };
    const removable = p.ingredients.filter((g) => g.removable);
    const fixed = p.ingredients.filter((g) => !g.removable);
    const anyProvisional = p.ingredients.some((g) => g.provisional);

    const body = `
      <div class="pd-img">${p.image ? `<img src="${esc(p.image)}" alt="">${p.imageKind === 'ilustracion' ? '<span class="tag">Imagen ilustrativa, no es foto del local</span>' : ''}` : ''}</div>
      <p style="margin:0 0 8px">${esc(p.description)}</p>
      <div class="row" style="display:flex;flex-wrap:wrap;gap:6px">
        <span class="price">${money(p.price)}</span>
        ${p.priceIsTest ? '<span class="tag tag-demo">Precio de prueba</span>' : ''}
        ${p.descriptionProvisional ? '<span class="tag tag-warn">Descripción provisional</span>' : ''}
      </div>
      ${p.ingredients.length ? `
        <h3 class="section-title">Ingredientes</h3>
        ${anyProvisional ? '<p class="hint" style="margin:0 0 6px">Los marcados con * están por confirmar con el local.</p>' : ''}
        ${fixed.length ? `<p class="hint" style="margin:0 0 6px">Incluye: ${fixed.map((g) => esc(g.name) + (g.provisional ? '*' : '')).join(', ')}</p>` : ''}
        ${removable.length ? `<p class="hint" style="margin:0 0 6px">Marca lo que quieres <b>quitar</b>:</p>
        <div class="box">${removable.map((g) => `
          <label class="check"><input type="checkbox" data-remove="${g.id}" ${st.removed.has(g.id) ? 'checked' : ''}>
            <span>Sin ${esc(g.name)}${g.provisional ? '*' : ''}</span></label>`).join('')}</div>` : ''}` : ''}
      ${p.extras.length ? `
        <h3 class="section-title">Agregados con costo</h3>
        <div class="box">${p.extras.map((e) => `
          <label class="check"><input type="checkbox" data-extra="${e.id}" ${st.extras.has(e.id) ? 'checked' : ''}>
            <span style="flex:1">${esc(e.name)}</span><b>+${money(e.price)}</b></label>`).join('')}</div>` : ''}
      <h3 class="section-title">Nota para este producto</h3>
      <textarea class="input" id="pdNote" maxlength="140" placeholder="Ej.: sin mayo, agregar mostaza, bien tostado">${esc(st.note)}</textarea>
      <p class="hint">La nota no agrega cobros. Si pides algo que el local no tiene, caja lo verá y te avisará antes de confirmar.</p>
      ${!editing ? '<p class="hint"><b>¿Dos unidades con indicaciones distintas?</b> Agrega una, vuelve a abrir el producto y agrega la otra con su propia nota: quedarán como líneas separadas.</p>' : ''}`;

    const foot = `<div class="foot-row">
        <div class="stepper" aria-label="Cantidad"><button type="button" data-q="-1" aria-label="Quitar una">−</button><output id="pdQty">${st.quantity}</output><button type="button" data-q="1" aria-label="Agregar una">+</button></div>
        <button class="btn btn-primary" id="pdAdd"></button></div>`;
    const sh = sheet({ title: p.name, body, foot });
    const price = () => (p.price + p.extras.filter((e) => st.extras.has(e.id)).reduce((s, e) => s + e.price, 0)) * st.quantity;
    const refresh = () => {
      sh.root.querySelector('#pdQty').textContent = st.quantity;
      sh.root.querySelector('#pdAdd').textContent = `${editing ? 'Guardar' : 'Agregar'} · ${money(price())}`;
    };
    refresh();
    sh.root.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.remove) t.checked ? st.removed.add(Number(t.dataset.remove)) : st.removed.delete(Number(t.dataset.remove));
      if (t.dataset.extra) t.checked ? st.extras.add(Number(t.dataset.extra)) : st.extras.delete(Number(t.dataset.extra));
      refresh();
    });
    sh.root.addEventListener('click', (e) => {
      const q = e.target.closest('[data-q]');
      if (q) { st.quantity = Math.min(20, Math.max(1, st.quantity + Number(q.dataset.q))); refresh(); }
      if (e.target.closest('#pdAdd')) {
        const line = {
          lid: editing?.lid || uuid(), productId: p.id, quantity: st.quantity,
          removed: [...st.removed].sort((a, b) => a - b), extras: [...st.extras].sort((a, b) => a - b),
          note: sh.root.querySelector('#pdNote').value.trim().slice(0, 140),
        };
        if (editing) {
          cart = cart.map((l) => (l.lid === editing.lid ? line : l));
        } else {
          const same = cart.find((l) => sameConfig(l, line));
          if (same) same.quantity = Math.min(20, same.quantity + line.quantity); else cart.push(line);
        }
        saveCart();
        sh.close();
        toast(editing ? 'Cambios guardados' : 'Agregado al pedido');
        if (editing) openCart();
      }
    });
  }

  // ---------------- Revisión del pedido ----------------
  let cartSheet = null;
  function cartBody() {
    return `
      ${menu.settings.demoMode ? '<p class="notice notice-demo"><b>Modo demostración:</b> este pedido es de prueba y no es una venta real.</p>' : ''}
      <div id="lines">${cart.map((l) => {
        const p = products.get(l.productId);
        return `<div class="line" data-lid="${l.lid}">
          <div class="line-head"><span>${l.quantity} × ${esc(p.name)}</span><span>${money(unitPrice(l) * l.quantity)}</span></div>
          ${modsHtml(lineView(l))}
          <div class="line-actions">
            <div class="stepper"><button data-step="-1" aria-label="Quitar una unidad">−</button><output>${l.quantity}</output><button data-step="1" aria-label="Agregar una unidad">+</button></div>
            <button class="btn btn-sm" data-edit>Editar</button>
            ${l.quantity > 1 ? '<button class="btn btn-sm" data-split>Indicación distinta para 1</button>' : ''}
            <button class="btn btn-sm btn-bad" data-del aria-label="Eliminar línea">Eliminar</button>
          </div></div>`;
      }).join('')}</div>
      <div class="total-row"><span>Total</span><span>${money(cartTotal())}</span></div>
      ${cart.some((l) => products.get(l.productId).priceIsTest) ? '<p class="hint">Incluye precios de prueba.</p>' : ''}`;
  }
  // Redibuja el contenido sin cerrar la hoja (evita parpadeos al sumar o restar).
  function refreshCart() {
    if (!cart.length) return cartSheet?.close();
    cartSheet.body.innerHTML = cartBody();
  }
  function openCart() {
    cartSheet?.close();
    if (!cart.length) return;
    const foot = '<button class="btn btn-primary btn-block" id="toCheckout">Continuar</button>';
    cartSheet = sheet({ title: 'Tu pedido', body: cartBody(), foot, onClose: () => { cartSheet = null; } });
    cartSheet.root.addEventListener('click', (e) => {
      const lineEl = e.target.closest('[data-lid]');
      const l = lineEl && cart.find((x) => x.lid === lineEl.dataset.lid);
      if (e.target.closest('#toCheckout')) { cartSheet.close(); openCheckout(); return; }
      if (!l) return;
      if (e.target.closest('[data-step]')) {
        l.quantity = Math.min(20, l.quantity + Number(e.target.closest('[data-step]').dataset.step));
        if (l.quantity < 1) cart = cart.filter((x) => x !== l);
        saveCart();
        refreshCart();
      } else if (e.target.closest('[data-del]')) {
        cart = cart.filter((x) => x !== l);
        saveCart();
        refreshCart();
      } else if (e.target.closest('[data-edit]')) {
        cartSheet.close();
        openProduct(l.productId, l);
      } else if (e.target.closest('[data-split]')) {
        // Separa una unidad en su propia línea para darle una indicación distinta
        l.quantity -= 1;
        const copy = { ...l, lid: uuid(), quantity: 1, removed: [...l.removed], extras: [...l.extras] };
        cart.splice(cart.indexOf(l) + 1, 0, copy);
        saveCart();
        cartSheet.close();
        openProduct(copy.productId, copy);
      }
    });
  }

  // ---------------- Envío ----------------
  function openCheckout() {
    const s = menu.settings;
    // Un identificador por intento de envío: si la red falla y se reintenta, no se duplica el pedido.
    let key = store.get(CHECKOUT_KEY, null);
    if (!key || key.cartSig !== JSON.stringify(cart)) { key = { id: uuid(), cartSig: JSON.stringify(cart) }; store.set(CHECKOUT_KEY, key); }
    const b = s.bank;
    const body = `
      <label class="field"><span>Tu nombre</span><input class="input" id="coName" maxlength="40" autocomplete="given-name" placeholder="Para llamarte cuando esté listo" value="${esc(store.get('rm_name', ''))}"></label>
      <div class="field"><span>Forma de pago</span>
        <div class="pay-opts" role="radiogroup">
          <label class="pay-opt"><input type="radio" name="pay" value="efectivo"><span>Efectivo</span></label>
          <label class="pay-opt"><input type="radio" name="pay" value="transferencia"><span>Transferencia</span></label>
        </div></div>
      <div id="cashInfo" hidden><p class="notice notice-info">Pagas en caja. Tu pedido pasa a preparación cuando caja reciba el efectivo.</p></div>
      <div id="transferInfo" hidden>
        <div class="bank">
          <b>Datos para transferir</b> ${s.bankIsTest ? '<span class="tag tag-demo">DATOS DE PRUEBA — NO TRANSFERIR</span>' : ''}
          <dl>
            <dt>Nombre</dt><dd>${esc(b.holder)}</dd><dt>RUT</dt><dd>${esc(b.rut)}</dd><dt>Banco</dt><dd>${esc(b.name)}</dd>
            <dt>Cuenta</dt><dd>${esc(b.account_type)} ${esc(b.account_number)}</dd><dt>Correo</dt><dd>${esc(b.email)}</dd>
            <dt>Monto</dt><dd>${money(cartTotal())}</dd>
          </dl>
        </div>
        <label class="field"><span>Comprobante de transferencia (imagen)</span>
          <input class="input" type="file" id="coReceipt" accept="image/jpeg,image/png,image/webp"></label>
        <img id="coPreview" class="receipt-preview" alt="Vista previa del comprobante" hidden>
        <p class="notice notice-warn"><b>Importante:</b> adjuntar el comprobante no confirma el pago. Caja revisará que el abono haya llegado a la cuenta antes de preparar tu pedido.</p>
      </div>
      <p class="notice notice-bad" id="coError" role="alert" hidden></p>
      <div class="total-row"><span>Total</span><span>${money(cartTotal())}</span></div>`;
    const foot = '<button class="btn btn-primary btn-block" id="coSend">Enviar pedido</button>';
    const sh = sheet({ title: 'Confirmar pedido', body, foot });
    const q = (sel) => sh.root.querySelector(sel);
    let previewUrl = null;
    sh.root.addEventListener('change', (e) => {
      if (e.target.name === 'pay') {
        q('#cashInfo').hidden = e.target.value !== 'efectivo';
        q('#transferInfo').hidden = e.target.value !== 'transferencia';
      }
      if (e.target.id === 'coReceipt') {
        const f = e.target.files[0];
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = f ? URL.createObjectURL(f) : null;
        q('#coPreview').hidden = !f;
        if (f) q('#coPreview').src = previewUrl;
      }
    });
    q('#coSend').addEventListener('click', async () => {
      const err = q('#coError');
      err.hidden = true;
      const name = q('#coName').value.trim();
      const pay = sh.root.querySelector('input[name=pay]:checked')?.value;
      if (name.length < 2) { err.textContent = 'Escribe tu nombre.'; err.hidden = false; q('#coName').focus(); return; }
      if (!pay) { err.textContent = 'Elige la forma de pago.'; err.hidden = false; return; }
      const file = pay === 'transferencia' ? q('#coReceipt').files[0] : null;
      if (file && file.size > 8 * 1024 * 1024) { err.textContent = 'La imagen supera los 8 MB.'; err.hidden = false; return; }
      store.set('rm_name', name);
      const order = {
        idempotencyKey: key.id, customerName: name, paymentMethod: pay, expectedTotal: cartTotal(),
        items: cart.map((l) => ({ productId: l.productId, quantity: l.quantity, removedIngredientIds: l.removed, extraIds: l.extras, note: l.note })),
      };
      const fd = new FormData();
      fd.append('order', JSON.stringify(order));
      if (file) fd.append('receipt', file);
      const btn = q('#coSend');
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        const r = await api('/api/orders', { method: 'POST', body: fd });
        cart = [];
        saveCart();
        store.del(CHECKOUT_KEY);
        store.set(LAST_KEY, { token: r.token, code: r.code });
        sh.close();
        history.pushState({}, '', `#pedido/${r.token}`);
        route();
      } catch (e2) {
        btn.disabled = false;
        btn.textContent = 'Enviar pedido';
        err.textContent = e2.status ? e2.message : 'Sin conexión. Revisa tu internet y vuelve a tocar “Enviar pedido” (no se duplicará).';
        err.hidden = false;
        if (['PRICE_CHANGED', 'MENU_CHANGED', 'UNAVAILABLE'].includes(e2.data?.code)) {
          store.del(CHECKOUT_KEY);
          await loadMenu();
          renderMenu();
          err.textContent += ' La carta se actualizó.';
        }
      }
    });
  }

  // ---------------- Estado del pedido ----------------
  let pollTimer = null;
  async function showStatus(token) {
    $('#app').hidden = true;
    $('#demoBanner').hidden = true;
    const v = $('#statusView');
    v.hidden = false;
    clearTimeout(pollTimer);
    let o;
    try { o = await api(`/api/orders/${encodeURIComponent(token)}`); } catch (e) {
      v.innerHTML = `<p class="notice notice-bad">${e.status === 404 ? 'No encontramos este pedido.' : 'Sin conexión. Reintentando…'}</p><a class="btn" href="#" data-link>Volver a la carta</a>`;
      if (e.status !== 404) pollTimer = setTimeout(() => showStatus(token), 5000);
      return;
    }
    $('#demoBanner').hidden = !o.isDemo;
    const order = ['pendiente', 'pago_confirmado', 'en_preparacion', 'listo', 'entregado'];
    const idx = order.indexOf(o.status);
    const waitMsg = o.paymentMethod === 'transferencia'
      ? 'Caja está verificando que la transferencia haya llegado a la cuenta. El comprobante por sí solo no confirma el pago.'
      : 'Acércate a caja para pagar en efectivo.';
    v.innerHTML = `
      ${o.isDemo ? '<p class="notice notice-demo"><b>Pedido de demostración.</b> No es una venta real.</p>' : ''}
      <p class="muted" style="margin:0">Pedido de ${esc(o.customerName)}</p>
      <div class="order-code">${esc(o.code)}</div>
      <p class="muted" style="margin-top:0">Muestra este número en caja.</p>
      ${o.status === 'rechazado' ? '<p class="notice notice-bad"><b>Pedido rechazado.</b> Acércate a caja para más información.</p>' : `
      <ol class="steps">${order.map((s, i) => `<li class="${i < idx ? 'done' : i === idx ? 'now' : ''}"><span class="dot"></span>${STATUS[s]}</li>`).join('')}</ol>`}
      ${o.status === 'pendiente' ? `<p class="notice notice-warn">${waitMsg}</p>` : ''}
      ${o.paymentMethod === 'transferencia' && !o.receiptAttached && o.status === 'pendiente' ? '<p class="notice notice-info">No adjuntaste comprobante. Si ya transferiste, avisa en caja.</p>' : ''}
      <h2 style="font-size:18px;margin:18px 0 8px">Detalle</h2>
      ${o.items.map((it) => `<div class="line"><div class="line-head"><span>${it.quantity} × ${esc(it.productName)}</span><span>${money(it.lineTotal)}</span></div>${modsHtml(it)}</div>`).join('')}
      <div class="total-row"><span>Total</span><span>${money(o.total)}</span></div>
      <p class="hint">Pago: ${o.paymentMethod === 'transferencia' ? 'Transferencia' : 'Efectivo'} · Esta página se actualiza sola.</p>
      <a class="btn btn-block" href="#" id="backToMenu">Volver a la carta</a>`;
    if (!['entregado', 'rechazado'].includes(o.status)) pollTimer = setTimeout(() => showStatus(token), 5000);
  }

  function route() {
    const m = location.hash.match(/^#pedido\/([A-Za-z0-9_-]+)$/);
    if (m) return showStatus(m[1]);
    clearTimeout(pollTimer);
    $('#statusView').hidden = true;
    $('#app').hidden = false;
    $('#demoBanner').hidden = !menu?.settings.demoMode;
    const last = store.get(LAST_KEY, null);
    const lo = $('#lastOrder');
    lo.hidden = !last;
    if (last) lo.innerHTML = `Tu último pedido: <b>${esc(last.code)}</b> · <a href="#pedido/${esc(last.token)}" data-link>Ver estado</a>`;
  }

  // ---------------- Eventos ----------------
  document.addEventListener('click', (e) => {
    const card = e.target.closest('[data-product]');
    if (card) openProduct(Number(card.dataset.product));
    if (e.target.closest('#openCart')) openCart();
    const link = e.target.closest('a[data-link], #backToMenu');
    if (link) { e.preventDefault(); history.pushState({}, '', link.getAttribute('href')); route(); }
  });
  window.addEventListener('popstate', route);

  (async () => {
    try {
      await loadMenu();
      renderMenu();
    } catch {
      $('#menu').innerHTML = '<p class="notice notice-bad">No se pudo cargar la carta. Revisa tu conexión y recarga la página.</p>';
    }
    route();
  })();
})();

    await loadSettings();
    renderFilters();
    switchTab('pedidos');
    poll();
  }
  function showLogin() {
    $('#shell').hidden = true;
    $('#demoBanner').hidden = true;
    $('#login').hidden = false;
    $('#pw').focus();
  }
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#loginErr').hidden = true;
    try {
      await api('/api/admin/login', { method: 'POST', json: { password: $('#pw').value } });
      $('#pw').value = '';
      boot();
    } catch (err) {
      $('#loginErr').textContent = err.message;
      $('#loginErr').hidden = false;
    }
