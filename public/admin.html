<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#23170d">
  <title>Caja · Rucka Monkey</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="demo-banner" id="demoBanner" hidden>MODO DEMOSTRACIÓN <small>Pedidos de prueba: no son ventas reales</small></div>

  <section id="login" class="login" hidden>
    <form id="loginForm" class="login-card">
      <div class="brand-mark" aria-hidden="true">RM</div>
      <h1>Caja Rucka Monkey</h1>
      <label class="field"><span>Contraseña</span><input class="input" type="password" id="pw" autocomplete="current-password" required></label>
      <p class="notice notice-bad" id="loginErr" role="alert" hidden></p>
      <button class="btn btn-primary btn-block">Entrar</button>
    </form>
  </section>

  <div id="shell" hidden>
    <nav class="tabs" aria-label="Secciones">
      <div class="tabs-brand">RM Caja</div>
      <button data-tab="pedidos" class="on"><span class="ti">🧾</span>Pedidos<b class="badge" id="newBadge" hidden>0</b></button>
      <button data-tab="productos"><span class="ti">🍔</span>Productos</button>
      <button data-tab="resumen"><span class="ti">📊</span>Resumen</button>
      <button data-tab="ajustes"><span class="ti">⚙️</span>Ajustes</button>
    </nav>
    <main class="panel">
      <section data-view="pedidos">
        <header class="view-head">
          <h1>Pedidos</h1>
          <span class="live" id="live" title="Actualización automática">● En vivo</span>
          <button class="icon-btn" id="soundBtn" aria-label="Activar sonido de aviso">🔕</button>
        </header>
        <div class="chips" id="orderFilters" role="tablist"></div>
        <div id="orders" class="orders"></div>
      </section>
      <section data-view="productos" hidden>
        <header class="view-head"><h1>Productos</h1><button class="btn btn-primary btn-sm" id="newProduct">+ Nuevo</button></header>
        <div id="catalog"></div>
      </section>
      <section data-view="resumen" hidden>
        <header class="view-head"><h1>Resumen del día</h1></header>
        <div id="stats"></div>
      </section>
      <section data-view="ajustes" hidden>
        <header class="view-head"><h1>Ajustes</h1></header>
        <div id="settings"></div>
      </section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
