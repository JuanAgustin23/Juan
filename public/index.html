<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffc43d">
  <title>Rucka Monkey · Carta</title>
  <meta name="description" content="Carta digital y pedidos de Rucka Monkey">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/menu.css">
</head>
<body>
  <!-- bienvenida -->
  <!-- Pantalla de bienvenida al abrir la carta. El servidor la quita si no existe la imagen. Tocar entra a la carta. -->
  <div id="welcome" class="welcome" role="button" tabindex="0" aria-label="Entrar a la carta">
    <img class="welcome-bg" alt="" aria-hidden="true">
    <img class="welcome-img" alt="El mono ya eligió, ahora te toca a ti.">
  </div>
  <!-- /bienvenida -->
  <div class="demo-banner" id="demoBanner" hidden>
    MODO DEMOSTRACIÓN
    <small>Precios, bebidas y datos bancarios de prueba. Los pedidos no son ventas reales.</small>
  </div>

  <div id="app">
    <header class="hero">
      <!-- Mascota como adorno difuminado: queda a la derecha, lejos del texto -->
      <img class="hero-mono" src="/img/marca/mono.svg" alt="" aria-hidden="true">
      <div class="hero-in">
        <div class="brand">
          <img class="brand-logo" src="/img/marca/mono.svg" alt="" width="52" height="52">
          <div>
            <h1 id="bizName">Rucka Monkey</h1>
            <p>Pide a tu gusto, fácil y rápido</p>
          </div>
        </div>
        <button class="head-cart" id="headCart" aria-label="Ver mi pedido">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L20.5 8H6.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.6" fill="currentColor"/><circle cx="17" cy="20" r="1.6" fill="currentColor"/></svg>
          <b class="head-count" id="headCount" hidden>0</b>
        </button>
      </div>
      <p class="notice notice-info" id="lastOrder" hidden></p>
    </header>
    <nav class="cats" id="cats" aria-label="Categorías"></nav>
    <main id="menu"><p class="muted">Cargando carta…</p></main>
    <div class="cartbar" id="cartbar" hidden>
      <button class="btn btn-primary" id="openCart"><span class="cb-left"><span class="count" id="cartCount">0</span> Ver mi pedido</span><span class="cb-total" id="cartTotal">$0</span></button>
    </div>
  </div>

  <div id="statusView" class="status-page" hidden></div>

  <script src="/js/common.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
